  /api/v1/wrapped/{year}:
    get:
      summary: Yearly recap (me, or ?user= with share_stats)
      parameters:
        - { name: year, in: path, required: true, schema: { type: integer, minimum: 1970, maximum: 9999 } }
        - { name: user, in: query, schema: { type: string } }
      responses:
        "200": { description: OK, content: { application/json: { schema: { $ref: "#/components/schemas/Wrapped" } } } }
        "400": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }

  /api/v1/circles/{id}/rooms:
    parameters: [{ $ref: "#/components/parameters/CircleId" }]
    get:
      summary: Rooms of a circle (members only)
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items: { type: array, items: { $ref: "#/components/schemas/Room" } }
        "404": { $ref: "#/components/responses/Error" }
    post:
      summary: Create a room (any member; creator hosts and listens)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name]
