                name: { type: string, minLength: 1, maxLength: 100 }
      responses:
        "201": { description: Created, content: { application/json: { schema: { $ref: "#/components/schemas/Room" } } } }
        "400": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
  /api/v1/rooms/{id}:
    parameters: [{ $ref: "#/components/parameters/RoomId" }]
    get:
      summary: Room with pending requests (circle members)
      responses:
        "200": { description: OK, content: { application/json: { schema: { $ref: "#/components/schemas/RoomDetail" } } } }
        "404": { $ref: "#/components/responses/Error" }
    delete:
      summary: Close the room (host, or circle owner/admin)
      responses:
        "204": { $ref: "#/components/responses/NoContent" }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
  /api/v1/rooms/{id}/join:
    parameters: [{ $ref: "#/components/parameters/RoomId" }]
    post:
      summary: Join as listener (circle members; idempotent)
      responses:
        "200": { description: OK, content: { application/json: { schema: { $ref: "#/components/schemas/Room" } } } }
        "404": { $ref: "#/components/responses/Error" }
  /api/v1/rooms/{id}/leave:
    parameters: [{ $ref: "#/components/parameters/RoomId" }]
    post:
      summary: Leave (host → longest-present listener; empty → closed)
      responses:
        "204": { $ref: "#/components/responses/NoContent" }
        "404": { $ref: "#/components/responses/Error" }
  /api/v1/rooms/{id}/state:
    parameters: [{ $ref: "#/components/parameters/RoomId" }]
    put:
      summary: Replace the playback state (host only); bumps seq, sets updated_at
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: "#/components/schemas/RoomStateInput" } } }
      responses:
        "200": { description: OK, content: { application/json: { schema: { $ref: "#/components/schemas/RoomState" } } } }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
  /api/v1/rooms/{id}/host:
    parameters: [{ $ref: "#/components/parameters/RoomId" }]
    put:
      summary: Hand hosting to a listener (host only)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [username]
              properties:
                username: { type: string }
      responses:
        "200": { description: OK, content: { application/json: { schema: { $ref: "#/components/schemas/Room" } } } }
        "400": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
  /api/v1/rooms/{id}/requests:
    parameters: [{ $ref: "#/components/parameters/RoomId" }]
    post:
      summary: Request a track (listeners)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [track]
              properties:
                track: { $ref: "#/components/schemas/Track" }
      responses:
        "201": { description: Created, content: { application/json: { schema: { $ref: "#/components/schemas/RoomRequest" } } } }
        "400": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }
  /api/v1/rooms/{id}/requests/{rid}:
    parameters:
      - $ref: "#/components/parameters/RoomId"
      - { name: rid, in: path, required: true, schema: { type: string } }
    delete:
      summary: Remove a request (host, or requester)
      responses:
        "204": { $ref: "#/components/responses/NoContent" }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }

  /rest/getNowPlaying.view:
    get:
      summary: Visibility-filtered Subsonic getNowPlaying (also at /rest/getNowPlaying, and at the server root)
      description: |
        Standard Subsonic auth parameters (`u`+`t`+`s`, `u`+`p`, or `apiKey`), validated against
        Navidrome and cached 10 minutes. Always HTTP 200; bad credentials → Subsonic error 40.
        `f=json` (or `jsonp`, treated as json) returns JSON, anything else XML
        (`xmlns="http://subsonic.org/restapi"`). Entry attributes: id, parent, isDir, title,
        album, artist, albumId, artistId, duration (s), coverArt (= track id), type, username,
        minutesAgo, playerId (1..n), playerName, state, positionMs.
      security: []
      parameters:
        - { name: u, in: query, schema: { type: string } }
        - { name: t, in: query, schema: { type: string } }
        - { name: s, in: query, schema: { type: string } }
        - { name: p, in: query, schema: { type: string } }
        - { name: apiKey, in: query, schema: { type: string } }
        - { name: f, in: query, schema: { type: string, enum: [xml, json, jsonp] } }
        - { name: v, in: query, schema: { type: string } }
        - { name: c, in: query, schema: { type: string } }
      responses:
        "200":
          description: Subsonic envelope.
          content:
            application/json:
              schema:
                type: object
                properties:
                  subsonic-response:
                    type: object
                    required: [status, version, type, serverVersion, openSubsonic]
                    properties:
                      status: { type: string, enum: [ok, failed] }
                      version: { type: string, const: "1.16.1" }
                      type: { type: string, const: cercle }
                      serverVersion: { type: string }
                      openSubsonic: { type: boolean }
                      error:
                        type: object
                        properties:
                          code: { type: integer }
                          message: { type: string }
                      nowPlaying:
                        type: object
                        properties:
                          entry: { type: array, items: { type: object } }
            application/xml: {}
    post:
      summary: Same as GET with form-encoded parameters
      security: []
      responses:
        "200": { description: Subsonic envelope. }
