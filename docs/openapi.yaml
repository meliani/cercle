            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items: { type: array, items: { $ref: "#/components/schemas/Live" } }
  /api/v1/feed:
    get:
      summary: Feed (newest first)
      parameters:
        - { name: circle, in: query, schema: { type: string }, description: Only visibility granted through this circle (must be a member). }
        - { name: user, in: query, schema: { type: string }, description: Only this user's items. }
        - $ref: "#/components/parameters/Limit"
        - $ref: "#/components/parameters/Before"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                required: [items, next]
                properties:
                  items: { type: array, items: { $ref: "#/components/schemas/FeedItem" } }
                  next: { oneOf: [{ type: string }, { type: "null" }] }
        "400": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
  /api/v1/feed/{item_id}/comments:
    parameters: [{ $ref: "#/components/parameters/ItemId" }]
    get:
      summary: Comments, oldest first
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items: { type: array, items: { $ref: "#/components/schemas/Comment" } }
        "404": { $ref: "#/components/responses/Error" }
